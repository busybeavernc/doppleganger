name: Build

# Every push to main builds Doppleganger and publishes release vMAJOR.MINOR.<build #> with:
#   DopplegangerSetup.exe       Windows installer (Start menu, uninstall entry, removes the camera on uninstall)
#   Doppleganger.exe            the Windows app itself (installed copies update themselves from this)
#   doppleganger-publisher.cer  the public half of the self-signed code-signing certificate
#   Doppleganger-mac-arm64.dmg  Mac (Apple Silicon) - drag to Applications; uses OBS Virtual Camera
#   Doppleganger-mac-x86_64.dmg Mac (Intel)
#   Doppleganger-mac-*.zip      the same apps, for the Mac's self-update
# Code signing runs when the SIGNING_CERT_PFX_BASE64 / SIGNING_CERT_PASSWORD secrets are set.
on:
  push:
    branches: [main]
    paths-ignore:            # the download page (GitHub Pages) doesn't need a new app build
      - "index.html"
      - "docs/**"
  workflow_dispatch:

concurrency:                 # a newer push replaces a build that hasn't finished
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # Build numbers continue from the old "Build Windows app" workflow (last release v0.1.15).
  BUILD_OFFSET: 15
  SIGN_PFX: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
  SIGN_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        run: python -m pytest -q tests

      - name: Stamp version
        id: ver
        shell: bash
        run: |
          base=$(python -c "import re;print('.'.join(re.search(r'\"(\d+)\.(\d+)', open('doppleganger/__init__.py').read()).groups()))")
          v="$base.$(( ${{ github.run_number }} + BUILD_OFFSET ))"
          echo "VERSION = \"$v\"" > doppleganger/_build.py
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # ---- The "Doppleganger" camera: softcam (MIT) renamed and built for 64- and 32-bit apps ----
      - uses: microsoft/setup-msbuild@v2

      - name: Build Doppleganger camera driver
        shell: pwsh
        run: |
          git clone --quiet https://github.com/tshino/softcam driver_src
          git -C driver_src checkout --quiet 6f5d8f9b5f7dc37a86a119b881bc75e1860fb3ec
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $line = & $vswhere -latest -property catalog_productLineVersion
          $toolset = if ([int]$line -ge 2026) { "v145" } else { "v143" }
          Write-Host "Visual Studio $line -> toolset $toolset"
          python driver/patch_softcam.py driver_src $toolset
          if ($LASTEXITCODE) { exit 1 }
          $sol = (Resolve-Path driver_src).Path + "\"
          foreach ($plat in "x64", "Win32") {
            msbuild driver_src\src\softcam\softcam.vcxproj /m /v:minimal /p:Configuration=Release /p:Platform=$plat "/p:SolutionDir=$sol"
            if ($LASTEXITCODE) { exit 1 }
          }
          New-Item -ItemType Directory -Force driver_build | Out-Null
          $dll64 = Get-ChildItem driver_src\x64\Release -Recurse -Filter softcam.dll | Select-Object -First 1
          $dll32 = Get-ChildItem driver_src\Win32\Release -Recurse -Filter softcam.dll | Select-Object -First 1
          Copy-Item $dll64.FullName driver_build\doppleganger_cam64.dll
          Copy-Item $dll32.FullName driver_build\doppleganger_cam32.dll
          Copy-Item driver\SOFTCAM-LICENSE.txt driver_build\

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build helpers (camera list, microphone mute)
        shell: cmd
        run: |
          cl /nologo /O2 /EHsc /utf-8 driver\listcams.cpp /Fe:driver_build\listcams.exe /Fo:driver_build\ ole32.lib oleaut32.lib strmiids.lib || exit /b 1
          cl /nologo /O2 /EHsc /utf-8 driver\micmute.cpp /Fe:driver_build\micmute.exe /Fo:driver_build\ ole32.lib || exit /b 1
          driver_build\listcams.exe
          driver_build\micmute.exe list

      - name: Prepare code-signing certificate
        if: env.SIGN_PFX != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\sign.pfx", [Convert]::FromBase64String($env:SIGN_PFX))
          "SIGN_FILE=$env:RUNNER_TEMP\sign.pfx" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Sign camera driver and helpers
        if: env.SIGN_PFX != ''
        shell: cmd
        run: signtool sign /q /fd SHA256 /f "%SIGN_FILE%" /p "%SIGN_PASSWORD%" /tr http://timestamp.digicert.com /td SHA256 /d "Doppleganger" driver_build\doppleganger_cam64.dll driver_build\doppleganger_cam32.dll driver_build\listcams.exe driver_build\micmute.exe

      - name: Build Doppleganger.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name Doppleganger
          --icon doppleganger/assets/icon.ico
          --add-data "doppleganger/assets;doppleganger/assets"
          --add-data "driver_build/doppleganger_cam64.dll;driver"
          --add-data "driver_build/doppleganger_cam32.dll;driver"
          --add-data "driver_build/listcams.exe;driver"
          --add-data "driver_build/micmute.exe;driver"
          --add-data "driver_build/SOFTCAM-LICENSE.txt;driver"
          --collect-data cv2
          --collect-all mediapipe
          --collect-binaries pyvirtualcam
          --hidden-import pynput.keyboard._win32
          --hidden-import pynput.mouse._win32
          --hidden-import pystray._win32
          launcher.py

      - name: Sign Doppleganger.exe
        if: env.SIGN_PFX != ''
        shell: cmd
        run: signtool sign /q /fd SHA256 /f "%SIGN_FILE%" /p "%SIGN_PASSWORD%" /tr http://timestamp.digicert.com /td SHA256 /d "Doppleganger" dist\Doppleganger.exe

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Q "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer\doppleganger.iss
          if ($LASTEXITCODE) { exit 1 }

      - name: Sign installer
        if: env.SIGN_PFX != ''
        shell: cmd
        run: signtool sign /q /fd SHA256 /f "%SIGN_FILE%" /p "%SIGN_PASSWORD%" /tr http://timestamp.digicert.com /td SHA256 /d "Doppleganger Setup" dist\DopplegangerSetup.exe

      - name: Remove signing certificate
        if: always() && env.SIGN_PFX != ''
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue "$env:RUNNER_TEMP\sign.pfx"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Doppleganger.exe
            dist/DopplegangerSetup.exe

  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15        # Apple Silicon
            arch: arm64
          - runner: macos-15-intel  # Intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          grep -v '^mediapipe' requirements.txt > req-base.txt
          pip install -r req-base.txt pyinstaller pytest
          # AI person detection; if MediaPipe has no build for this Mac, the app uses room calibration.
          pip install "$(grep '^mediapipe' requirements.txt | cut -d'#' -f1 | xargs)" || echo "::warning::MediaPipe unavailable on ${{ matrix.arch }}"

      - name: Run tests
        run: python -m pytest -q tests

      - name: Stamp version
        id: ver
        run: |
          base=$(python -c "import re;print('.'.join(re.search(r'\"(\d+)\.(\d+)', open('doppleganger/__init__.py').read()).groups()))")
          v="$base.$(( ${{ github.run_number }} + BUILD_OFFSET ))"
          echo "VERSION = \"$v\"" > doppleganger/_build.py
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build Doppleganger.app
        env:
          DOPPLEGANGER_VERSION: ${{ steps.ver.outputs.version }}
        run: pyinstaller --noconfirm installer/doppleganger-mac.spec

      - name: Self-test the app
        run: dist/Doppleganger.app/Contents/MacOS/Doppleganger --selftest

      - name: Sign (ad hoc), zip and make the disk image
        run: |
          codesign --force --deep --sign - dist/Doppleganger.app
          codesign --verify --deep dist/Doppleganger.app
          name=Doppleganger-mac-${{ matrix.arch }}
          ditto -c -k --keepParent dist/Doppleganger.app "dist/$name.zip"
          mkdir dmg && cp -R dist/Doppleganger.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname Doppleganger -srcfolder dmg -ov -format UDZO "dist/$name.dmg"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: |
            dist/Doppleganger-mac-${{ matrix.arch }}.dmg
            dist/Doppleganger-mac-${{ matrix.arch }}.zip

  # Windows is released as soon as it's built; the Mac files are added to the same release
  # when they're ready (Mac build machines can sit in GitHub's queue for a while).
  release:
    needs: windows
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pub.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: artifacts

      - name: Publish release
        id: pub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(python3 -c "import re;print('.'.join(re.search(r'\"(\d+)\.(\d+)', open('doppleganger/__init__.py').read()).groups()))")
          v="$base.$(( ${{ github.run_number }} + BUILD_OFFSET ))"
          notes="**Download:** https://busybeavernc.github.io/doppleganger/ (picks the right file for your computer).

          **Windows:** DopplegangerSetup.exe. **Mac:** Doppleganger-mac-arm64.dmg (Apple Silicon) or Doppleganger-mac-x86_64.dmg (Intel), added a few minutes after this release appears; needs [OBS Studio](https://obsproject.com/download) 30+.

          $(git log -1 --pretty=%s)"
          gh release create "v$v" artifacts/DopplegangerSetup.exe artifacts/Doppleganger.exe installer/doppleganger-publisher.cer \
            --title "Doppleganger $v" --notes "$notes" --target "$GITHUB_SHA" --latest
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

  mac-release:
    needs: [release, mac]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mac-*
          merge-multiple: true
          path: artifacts

      - name: Add the Mac apps to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(find artifacts -type f \( -name '*.dmg' -o -name '*.zip' \) | sort)
          echo "$files"
          if [ -z "$files" ]; then echo "::warning::No Mac build succeeded this time"; exit 0; fi
          gh release upload "${{ needs.release.outputs.tag }}" $files --clobber -R "$GITHUB_REPOSITORY"
